<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Domino Rush (test)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1b3a;
      /* Stop the page from scrolling or zooming when you tap and swipe */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #domino-game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- The game draws itself inside this box -->
  <div id="domino-game"></div>

  <!-- Phaser, the game engine, loaded from the internet -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <!-- The Domino Rush test game -->
  <script src="domino.js"></script>
</body>
</html>
